# Builds the RPM and DEB.
# - Tag push (v0.1, v1.2, ...): builds and publishes to GitHub Releases.
# - Manual run: test build only, unless "publish" is ticked: then it creates the
#   vX.Y tag (from catamount/__init__.py) on the commit it ran on, and publishes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the vX.Y tag and publish the release"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: python3 -m unittest -v

      - name: Work out the release tag
        id: tag
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' catamount/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version numbers
        run: packaging/check-version.sh ${{ steps.tag.outputs.tag }}

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/dnf
            .cache/apt
          key: pkgcache-${{ hashFiles('packaging/build-*.sh') }}
          restore-keys: pkgcache-

      - name: Build RPM (Fedora)
        run: |
          mkdir -p .cache/dnf .cache/apt
          docker run --rm -v "$PWD:/src" -v "$PWD/.cache/dnf:/var/cache/dnf" -w /src \
            fedora:42 bash packaging/build-rpm.sh

      - name: Build DEB (Debian)
        run: |
          docker run --rm -v "$PWD:/src" -v "$PWD/.cache/apt:/var/cache/apt/archives" -w /src \
            debian:trixie bash packaging/build-deb.sh

      - name: Checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist .cache
          cd dist && sha256sum * | tee SHA256SUMS

      - name: Publish release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          V="${TAG#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "CataMount $V" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
